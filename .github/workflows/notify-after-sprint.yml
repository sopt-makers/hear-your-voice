name: Notify after sprint ends

on:
  schedule:
    - cron: '0 15 * * *' # 매일 자정 KST (UTC 15:00)
  workflow_dispatch: # 수동 실행 (테스트용)

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notify-sprint Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_STATUS=$(curl -sS --connect-timeout 10 --max-time 60 -o response.json -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/functions/v1/notify-sprint" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")
          echo "Response: $(cat response.json)"
          [ "$HTTP_STATUS" = "200" ] || exit 1
