name: Send sprint DM

on:
  schedule:
    - cron: '10 15 * * *' # 매일 00:10 KST (UTC 15:10)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

jobs:
  send:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    steps:
      - name: Trigger send-sprint-dm Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          HTTP_STATUS=$(curl -sS --connect-timeout 10 --max-time 60 -o response.json -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/functions/v1/send-sprint-dm" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "Response: $(cat response.json)"
          [ "$HTTP_STATUS" = "200" ] || exit 1
